    get:
      tags:
        - user
      summary: Finds user by ID
      description: Returns a single user by its ID
      operationId: findOneUserID
      parameters:
        - name: id
          in: path
          description: ID of user to find
          required: true
          schema:
            $ref: '#/components/schemas/UserIdDto'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid status value
          content: {}
  /user/{id}:
    put:
      tags:
        - user
      summary: Updates an user in the db with form data
      operationId: updateUser
      parameters:
        - name: id
          in: path
          description: ID of user that needs to be updated
          required: true
          schema:
            $ref: '#/components/schemas/UserIdDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
        required: true
      responses:
        '405':
          description: Invalid input
          content: {}
    delete:
      tags:
        - user
      summary: Deletes an user
      operationId: removeUser
      parameters:
        - name: id
          in: path
          description: User id to delete
          required: true
          schema:
            $ref: '#/components/schemas/UserIdDto'
      responses:
        '404':
          description: User not found
          content: {}

components:
  schemas:
    Client:
      type: object
      properties:
        dni:
          type: number
          format: int64
        penalty:
          type: number
          format: float
          default: 0
      required:
        - dni
    ClientIdDto:
      type: string
      required:
        - id
    UpdateClientDto:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          description: Campos opcionales para actualizar un cliente
          required: [] # todos opcionales

    Dish:
      type: object
      properties:
        cod:
          type: string
          example: 'PLT001'
        name:
          type: string
          example: 'Bife Ancho con Salsa de Vino y Papas Rústicas'
        description:
          type: string
          example: 'Jugoso bife ancho de res de Carnes Libertarias, sellado a la parrilla y bañado en salsa de vino tinto con reducción de especias del mundo. Acompañado de papas rústicas crocantes y vegetales salteados.'
        picture:
          type: string
          description: URL de la imagen (por ejemplo, de Cloudinary)
        price:
          type: number
          format: float
        calification:
          type: number
          format: float
        tag:
          type: string
          description: Categoria del plato (carnes/parrilla/pastas/postres/ensalada/etc)
        ingredients:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
            required:
              - id
          example:
            - id: '1954371590753882225'
            - id: '1954371590753882226'
          chef:
            type: object
            properties:
              id:
                type: string
                example: '1954371590753882225'
      required:
        - cod
        - name
        - price
        - calification
        - ingredients
        - chef
    DishIdDto:
      type: string
      required:
        - id
    UpdateDishDto:
      allOf:
        - $ref: '#/components/schemas/CreateDishDto'
      description: DTO para actualizar un plato, todos los campos son opcionales

    Employee:
      type: object
      properties:
        taxId:
          type: string
          example: '20-12345678-9'
        shift:
          type: string
          example: 'Noche'
        workedHours:
          type: number
          format: float
          example: 160
        priceHour:
          type: number
          format: float
          example: 15.5
        role:
          type: string
          example: 'chef'
        hierarchy:
          type: string
        tag:
          type: string
          example: 'pastas'
        calification:
          type: number
          example: 0
        sector:
          type: string
          example: 'terraza'

      required:
        - taxId
        - shift
        - workedHours
        - priceHour
        - role
    EmployeeIdDto:
      type: string
      required:
        - id
    UpdateEmployeeDto:
      allOf:
        - $ref: '#/components/schemas/Employee'
      description: DTO para actualizar un empleado. Los campos son opcionales excepto `workedHours` y `priceHour`.

    Ingredient:
      type: object
      properties:
        cod:
          type: string
          example: 'ING001'
        name:
          type: string
          example: 'Pepinillo'
        description:
          type: string
          example: 'Pepinillo fresco'
        stock:
          type: number
          example: 50
        uniteOfMeasure:
          type: string
          example: 'kg'
        origin:
          type: string
          example: 'Vegetal'
        stockLimit:
          type: number
          example: 10
        suppliers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
            required:
              - id
          example:
            - id: '1954371590753882225'
            - id: '1954371590753882226'
      required:
        - cod
        - name
        - stock
        - uniteOfMeasure
        - origin
        - stockLimit
        - suppliers
    IngredientIdDto:
      type: string
      required:
        - id
    UpdateIngredientDto:
      allOf:
        - $ref: '#/components/schemas/Ingredient'
      description: DTO para actualizar un ingrediente, todos los campos son opcionales

    Order:
      type: object
      properties:
        description:
          type: string
          example: 'Pedido para mesa 12 con preferencia sin sal'
        status:
          type: string
          example: 'pending'
        estimatedEndTime:
          type: string
          format: date-time
          example: '2025-08-08T15:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2025-08-08T15:10:00Z'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        client:
          type: object
          properties:
            id:
              type: string
              example: '1954371590753882225'
          description: ID del cliente que realizó el pedido
        table:
          type: object
          properties:
            id:
              type: string
              example: '1954371590753882225'
          description: ID de la mesa del pedido
    OrderIdDto:
      type: string
      required:
        - orderId
    UpdateOrderDto:
      allOf:
        - $ref: '#/components/schemas/Order'
      description: 'Todos los campos son opcionales para actualización'
    OrderItem:
      type: object
      properties:
        dish:
          type: object
          properties:
            id:
              type: string
              example: '1954707475630395502'
        quantity:
          type: integer
          example: 2

    Bill:
      type: object
      properties:
        paymentMethod:
          type: string
          example: 'Mercado Pago'

    Supplier:
      type: object
      properties:
        companyName:
          type: string
          example: 'La fabrica de humo'
        taxId:
          type: string
          example: '30-12345678-9'
        mail:
          type: string
          format: email
          example: 'contacto@ladrilloenlasmanos.com'
        phoneNumber:
          type: string
          example: '+54 9 341 555 1234'
        typeIngredient:
          type: string
          example: 'Pasta'
        fullName:
          type: string
          example: 'Geronimo Benavides'
        bussinessName:
          type: string
          example: 'Politica Evitemos S.A.'
    SupplierIdDto:
      type: string
      required:
        - id:
    UpdateSupplierDto:
      allOf:
        - $ref: '#/components/schemas/Supplier'
      description: 'Todos los campos son opcionales para actualización'

    Table:
      type: object
      properties:
        cod:
          type: string
        capacity:
          type: integer
        description:
          type: string
        occupied:
          type: boolean
          example: false
        sector:
          type: string
          example: sector 1
      required:
        - cod
        - capacity
        - occupied
    TableIdDto:
      type: string
      required:
        - id
    UpdateTableDto:
      allOf:
        - $ref: '#/components/schemas/Table'
      description: DTO para actualizar una mesa, todos los campos son opcionales

    User:
      type: object
      properties:
        email:
          type: string
          example: 'admin@admin.com'
        fullName:
          type: string
          example: 'Valentin'
        password:
          type: string
          format: password
          example: 'ValenPro123'
        phoneNumber:
          type: string
          example: '+54 9 341 254 7935'
        role:
          type: string
          example: 'admin'
        profilePicture:
          type: string
        client:
          type: object
          properties:
            id:
              type: string
              example: '1954371590753882225'
        employee:
          type: object
          properties:
            id:
              type: string
              example: '1954371590753882225'
      required:
        - email
        - fullName
        - password
        - phoneNumber
        - role            
    UserIdDto:
      type: string
      required:
        - id
    UpdateUserDto:
      allOf:
        - $ref: '#/components/schemas/User'

