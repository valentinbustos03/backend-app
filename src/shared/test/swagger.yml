openapi: 3.0.1
info:
  title: U-Kitchen API
  description: 'API del sistema de restaurante.'
  servers:
    - url: http://localhost:3000/api-docs
tags:
  - name: client
    description: Everything about your Clietns
  - name: dish
    description: Everything about your Dishes
  - name: employee
    description: Everything about your Employees
  - name: ingredient
    description: Everything about your Ingredients
  - name: order
    description: Everything about your Orders
  - name: supplier
    description: Everything about your Suppliers
  - name: table
    description: Everything about your Tables
paths:
  /client/add:
    post:
      tags:
        - client
      summary: Add a new clietn to the db
      operationId: addClient
      requestBody:
        description: Client object that needs to be added to the db
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Invalid input
          content: {}
      # security:
      #   - petstore_auth:
      #       - write:pets
      #       - read:pets
      x-codegen-request-body-name: body  
  /client/findAll:
    get:
        tags:
          - client
        summary: Get all clients
        operationId: findAllClient
        responses:
          '200':
            description: successful operation
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Client'
          '400':
            description: Invalid status value
            content: {}
  /client/id/{id}:
    get:
      tags:
        - client
      summary: Finds Client by ID
      description: Returns a single client by its ID
      operationId: findOneClientID
      parameters:
        - name: id
          in: path
          description: ID of client to find
          required: true
          schema:
            $ref: '#/components/schemas/ClientIdDto'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Invalid status value
          content: {}
        '404':
          description: Client not found
          content: {}  
  /client/{id}:
    put:
      tags:
        - client
      summary: Updates a client in the db with form data
      operationId: updateClient
      parameters:
        - name: id
          in: path
          description: ID of client that needs to be updated
          required: true
          schema:
            $ref: '#/components/schemas/ClientIdDto'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateClientDto'
      responses:
        '405':
          description: Invalid input
          content: {}
    delete:
      tags:
        - client
      summary: Deletes a client
      operationId: removeClient
      parameters:
        - name: id
          in: path
          description: Client id to delete
          required: true
          schema:
            $ref: '#/components/schemas/ClientIdDto'
      responses:
        '404':
          description: Client not found
          content: {}
