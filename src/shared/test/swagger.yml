components:
  schemas:
    Client:
      type: object
      properties:
        dni:
          type: number
          format: int64
        penalty:
          type: number
          format: float
          default: 0
      required:
        - dni
    ClientIdDto:
      type: string
      required:
        - id
    UpdateClientDto:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          description: Campos opcionales para actualizar un cliente
          required: [] # todos opcionales

    Dish:
      type: object
      properties:
        cod:
          type: string
        name:
          type: string
        description:
          type: string
        picture:
          type: string
          description: URL de la imagen (por ejemplo, de Cloudinary)
        price:
          type: number
          format: float
        calification:
          type: number
          format: float
        ingredients:
          type: array
          items:
            type: string
      required:
        - cod
        - name
        - price
        - calification
        - ingredients
    DishIdDto:
      type: string
      required:
        - id
    UpdateDishDto:
      allOf:
        - $ref: '#/components/schemas/CreateDishDto'
      description: DTO para actualizar un plato, todos los campos son opcionales

    Employee:
      type: object
      properties:
        taxId:
          type: string
          example: '20-12345678-9'
        shift:
          type: string
          example: 'Noche'
        workedHours:
          type: number
          format: float
          example: 160
        priceHour:
          type: number
          format: float
          example: 15.5
      required:
        - taxId
        - shift
        - workedHours
        - priceHour
    EmployeeIdDto:
      type: string
      required:
        - id
    UpdateEmployeeDto:
      allOf:
        - $ref: '#/components/schemas/Employee'
      description: DTO para actualizar un empleado. Los campos son opcionales excepto `workedHours` y `priceHour`.

    Ingredient:
      type: object
      properties:
        cod:
          type: string
          example: 'ING001'
        name:
          type: string
          example: 'Tomate'
        description:
          type: string
          example: 'Tomate fresco'
        stock:
          type: number
          example: 50
        uniteOfMeasure:
          type: string
          example: 'kg'
        origin:
          type: string
          example: 'Vegetal'
        stockLimit:
          type: number
          example: 10
        suppliers:
          type: array
          items:
            type: string
          description: Lista de IDs de proveedores
      required:
        - cod
        - name
        - stock
        - uniteOfMeasure
        - origin
        - stockLimit
        - suppliers
    IngredientIdDto:
      type: string
      required:
        - id
    UpdateIngredientDto:
      allOf:
        - $ref: '#/components/schemas/CreateIngredientDto'
      description: DTO para actualizar un ingrediente, todos los campos son opcionales

    Order:
      type: object
      properties:
        description:
          type: string
          example: 'Pedido para mesa 12 con preferencia sin sal'
        status:
          type: string
          example: 'pending'
        startTime:
          type: string
          format: date-time
          example: '2025-08-08T14:30:00Z'
        estimatedEndTime:
          type: string
          format: date-time
          example: '2025-08-08T15:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2025-08-08T15:10:00Z'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        client:
          type: string
          description: ID del cliente que realizó el pedido
    OrderIdDto:
      type: string
      required:
        - orderId
    UpdateOrderDto:
      allOf:
        - $ref: '#/components/schemas/Order'
      description: 'Todos los campos son opcionales para actualización'
    OrderItem:
      type: object
      properties:
        dish:
          $ref: '#/components/schemas/Dish'
        quantity:
          type: integer
          example: 2

    Supplier:
      type: object
      properties:
        companyName:
          type: string
          example: 'La fabrica de humo'
        taxId:
          type: string
          example: '30-12345678-9'
        mail:
          type: string
          format: email
          example: 'contacto@ladrilloenlasmanos.com'
        phoneNumber:
          type: string
          example: '+54 9 341 555 1234'
        typeIngredient:
          type: string
          example: 'Pasta'
        fullName:
          type: string
          example: 'Geronimo Benavides'
        bussinessName:
          type: string
          example: 'Politica Evitemos S.A.'
    SupplierIdDto:
      type: string
      required:
        - id:
    UpdateSupplierDto:
      allOf:
        - $ref: '#/components/schemas/Supplier'
      description: 'Todos los campos son opcionales para actualización'

    Table:
      type: object
      properties:
        cod:
          type: string
        capacity:
          type: integer
        description:
          type: string
        occupied:
          type: boolean
          example: false
      required:
        - cod
        - capacity
        - occupied
    TableIdDto:
      type: string
      required:
        - id
    UpdateTableDto:
      allOf:
        - $ref: '#/components/schemas/Table'
      description: DTO para actualizar una mesa, todos los campos son opcionales
